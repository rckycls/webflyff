<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>FlyFF Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101418;
        color: #e6e6e6;
        font: 14px/1.4 system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 1000;
        display: flex;
        justify-content: center;
        gap: 4px;
        padding: 6px 8px max(6px, env(safe-area-inset-bottom));
        pointer-events: none;
      }
      #nav a {
        pointer-events: auto;
        padding: 4px 12px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.65);
        color: #e6e6e6;
        text-decoration: none;
      }
      body[data-route='character'] #nav a[href='#/character'],
      body[data-route='world'] #nav a[href='#/world'],
      body[data-route='compare'] #nav a[href='#/compare'] {
        background: #3b6ea8;
      }
      .placeholder {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #8b949e;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <nav id="nav">
      <a href="#/character">Character</a>
      <a href="#/world">World</a>
      <a href="#/compare">Compare</a>
    </nav>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>FlyFF Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101418;
        color: #e6e6e6;
        font: 14px/1.4 system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 1000;
        display: flex;
        justify-content: center;
        gap: 4px;
        padding: 6px 8px max(6px, env(safe-area-inset-bottom));
        pointer-events: none;
      }
      #nav a {
        pointer-events: auto;
        padding: 4px 12px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.65);
        color: #e6e6e6;
        text-decoration: none;
      }
      body[data-route='character'] #nav a[href='#/character'],
      body[data-route='world'] #nav a[href='#/world'],
      body[data-route='compare'] #nav a[href='#/compare'] {
        background: #3b6ea8;
      }
      body[data-embedded] #nav {
        display: none;
      }
      /* the page itself draws nothing: the measurements that count are the overlay of the viewer in its frame */
      body[data-route='compare'] #overlay {
        display: none;
      }
      .compare {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 12px 16px 64px;
        background: #101418;
      }
      .compare h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .compare p {
        max-width: 60rem;
        margin: 0 0 12px;
      }
      .compare-intro,
      .compare-note {
        color: #8b949e;
      }
      .compare-notice {
        color: #f0b429;
      }
      .compare-spots {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 16px;
        padding: 0;
        list-style: none;
      }
      .compare-spots a {
        display: block;
        padding: 6px 10px;
        border-radius: 4px;
        background: #1c232b;
        color: #e6e6e6;
        text-decoration: none;
      }
      .compare-spots a[aria-current='true'] {
        background: #3b6ea8;
      }
      .compare-spots small {
        display: block;
        color: #8b949e;
      }
      .compare-spots a[aria-current='true'] small {
        color: #d6e4f5;
      }
      .compare-panes {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px;
      }
      /* narrower than 768 px: the viewer above, the reference below */
      @media (max-width: 767px) {
        .compare-panes {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .compare-pane {
        min-width: 0;
        margin: 0;
      }
      .compare-pane figcaption {
        margin-bottom: 4px;
        color: #8b949e;
      }
      .compare-pane figcaption a {
        margin-left: 8px;
        color: #8ab4e8;
      }
      .compare-frame {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid #2d3640;
        background: #0b0e11;
      }
      .compare-frame iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      .compare-frame img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .compare-missing {
        margin: 0;
        padding: 0 12px;
        color: #8b949e;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <nav id="nav">
      <a href="#/character">Character</a>
      <a href="#/world">World</a>
      <a href="#/compare">Compare</a>
    </nav>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

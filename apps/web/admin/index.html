<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>osflyff admin</title>
  <link rel="stylesheet" href="/panel.css">
  <script type="module" src="/panel.js"></script>
</head>
<body>
  <header class="top" hidden>
    <strong class="brand">osflyff admin</strong>
    <nav class="tabs" aria-label="Panel sections"></nav>
    <span class="who"></span>
    <button type="button" class="logout quiet">Log out</button>
  </header>
  <main class="sections"></main>
  <div class="login-cover" hidden>
    <form class="login" autocomplete="on">
      <h1>osflyff admin</h1>
      <label>Name <input name="user" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <label>Code from your authenticator app <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" maxlength="6" required></label>
      <button type="submit">Log in</button>
      <p class="message problem" role="alert" hidden></p>
    </form>
  </div>
  <noscript>The panel needs JavaScript.</noscript>
</body>
</html>
